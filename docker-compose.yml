# Local development / single Droplet deployment.
# For DigitalOcean App Platform use clutchx3d/.do/app.yaml and wolf/.do/app.yaml instead.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clutch
      POSTGRES_PASSWORD: clutch
      POSTGRES_DB: clutchx3d
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clutch -d clutchx3d"]
      interval: 5s
      retries: 10

  clutchx3d:
    build: ./clutchx3d
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://clutch:clutch@db:5432/clutchx3d
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me-0123456789}
      UPLOAD_DIR: /data/uploads
      # Set these to store uploads in DigitalOcean Spaces instead of the local volume
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_REGION: ${SPACES_REGION:-sgp1}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  wolf:
    build: ./wolf
    environment:
      NODE_ENV: production
      WOLF_ADMIN_USERNAME: ${WOLF_ADMIN_USERNAME:-admin}
      WOLF_ADMIN_PASSWORD: ${WOLF_ADMIN_PASSWORD:-change-me-please}
      WOLF_SESSION_SECRET: ${WOLF_SESSION_SECRET:-dev-session-secret-change-me-0123456789}
      WOLF_COOKIE_SECURE: ${WOLF_COOKIE_SECURE:-false}
      CLUTCHX3D_API_URL: http://clutchx3d:8080
      CLUTCHX3D_ADMIN_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me-0123456789}
      CLUTCHX3D_PUBLIC_URL: ${CLUTCHX3D_PUBLIC_URL:-http://localhost:8080}
      # Wolf's projects, research and academics. Its tables live in their own "wolf" schema.
      WOLF_DATABASE_URL: postgres://clutch:clutch@db:5432/clutchx3d
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      clutchx3d:
        condition: service_started

volumes:
  dbdata:
  uploads:
